<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c0fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#00d2ff" stroke-width="2.5" />

  <!-- Radio Waves -->
  <path d="M12 24 A24 24 0 0 1 52 24" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" opacity="0.65" />
  <path d="M18 30 A16 16 0 0 1 46 30" fill="none" stroke="url(#cyanGrad)" stroke-width="3.2" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />
  <path d="M24 36 A8 8 0 0 1 40 36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Antenna Mast -->
  <line x1="32" y1="38" x2="32" y2="52" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M24 53 L32 46 L40 53" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Beacon Core Node -->
  <circle cx="32" cy="38" r="4.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="38" r="2.5" fill="#00d2ff" />
</svg>
