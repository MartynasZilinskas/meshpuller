                            <div class="popup-grid">
                                <div class="popup-stat">
                                    <div class="popup-stat-val" style="color: ${battStyle.class === 'crit' ? '#ef4444' : '#10b981'};">
                                        ${battV !== null ? parseFloat(battV).toFixed(2) + ' V' : 'N/A'}
                                    </div>
                                    <div class="popup-stat-lbl">🔋 Srovė / Įtampa</div>
                                </div>
                                <div class="popup-stat">
                                    <div class="popup-stat-val" style="color: var(--accent-cyan);">
                                        ${tempC !== null ? tempStyle.text : 'N/A'}
                                    </div>
                                    <div class="popup-stat-lbl">🌡️ Temp.</div>
                                </div>
                            </div>

                            <!-- Telemetrijos grafiko sekcija -->
                            <div class="popup-chart-box">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                                    <span style="font-size: 0.74rem; font-weight: 600; color: #ffffff;">📈 Telemetrijos grafikas</span>
                                    <span style="font-size: 0.68rem; color: var(--text-dim);" id="popup-chart-sub-${nodeId}">Kraunama...</span>
                                </div>
                                <div style="position: relative; height: 140px; width: 100%;">
                                    <canvas id="popup-chart-${nodeId}"></canvas>
                                </div>
                            </div>

                            <div class="popup-footer" style="flex-direction: column; gap: 4px; align-items: stretch; margin-top: 6px;">
                                <div style="font-size: 0.72rem; color: #a78bfa; display:flex; justify-content:space-between;" title="${formatLithuanianDateTime(telemTime)}">
                                    <span>⏱️ Paskutinė telemetrija:</span>
                                    <strong>${telemTime ? formatRelativeTime(telemTime) + ' (' + formatLithuanianTime(telemTime, false) + ')' : 'Nėra duomenų'}</strong>
                                </div>
                            </div>
                        </div>
                    `;

                    const marker = L.marker([lat, lon], { icon: customIcon })
                        .bindPopup(popupContent, {
                            offset: [0, -6],
                            closeButton: true,
                            autoPan: true
                        });

                    // Mobiliame įrenginyje: paspaudus ant žymeklio atidarome erdvią Bottom Sheet kortelę
                    marker.on('click', () => {
                        if (window.innerWidth <= 768) {
                            marker.closePopup();
                            openMobileSheet(node);
                        }
                    });

                    // Kai atidaromas didelis langas (popup): paslepiame mažąjį preview burbulą
                    marker.on('popupopen', () => {
                        const el = marker.getElement();
                        if (el) el.classList.add('popup-open');

                        // Šoninėje panelėje aktyvuojame atitinkamą kortelę
                        document.querySelectorAll('.node-item-card').forEach(c => c.classList.remove('active'));
                        const card = document.getElementById(`card-${nodeId}`) ||
                                     document.querySelector(`.node-item-card[data-node-id="${cleanId}"], .node-item-card[data-clean-id="${cleanId}"]`);
                        if (card) {
                            card.classList.add('active');
                            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }

                        // Atnaujiname URL saitą (#1bbd arba public_key)
                        const currentHash = (window.location.hash || '').replace(/^#[!/]?/, '').toLowerCase();
                        const isPubKeyHash = currentHash.length > 8 && node.public_key && node.public_key.toLowerCase().startsWith(currentHash);
                        const targetHash = isPubKeyHash ? node.public_key.toLowerCase() : cleanId;
                        if (targetHash && window.location.hash !== ('#' + targetHash)) {
                            if (history.replaceState) {
                                history.replaceState(null, '', '#' + targetHash);
                            }
                        }

                        // Užkrauname ir nubraižome telemetrijos grafiką
                        setTimeout(() => {
                            loadAndRenderNodeChart(`popup-chart-${nodeId}`, `popup-chart-sub-${nodeId}`, node.node_id || node.public_key || nodeId, telemetryChartDays);
                        }, 50);
                    });

                    // Kai uždaromas didelis langas (popup): grąžiname mažąjį preview burbulą ir sunaikiname grafiką
                    marker.on('popupclose', () => {
                        const el = marker.getElement();
                        if (el) el.classList.remove('popup-open');
                        destroyChart(`popup-chart-${nodeId}`);
                    });
                    
                    markersGroup.addLayer(marker);
                    markersMap[nodeId] = marker;
                    markersMap[cleanId] = marker;
                    if (node.node_id) {
                        const rawNid = String(node.node_id).trim().toLowerCase();
                        markersMap[rawNid] = marker;
                        markersMap[rawNid.replace(/^[#!]+/, '')] = marker;
                    }
                    if (node.public_key) {
                        const pk = String(node.public_key).trim().toLowerCase();
                        markersMap[pk] = marker;
                        if (pk.length >= 4) {
                            markersMap[pk.substring(0, 4)] = marker;
                        }
                    }
                }

                // 2. ŠONINĖS PANELĖS KORTELĖ
                const card = document.createElement('div');
                card.className = 'node-item-card ' + (borderClass || 'border-blue');
                card.id = `card-${nodeId}`;
                card.setAttribute('data-node-id', (node.node_id || '').toLowerCase());
                card.setAttribute('data-clean-id', cleanId);
                if (node.public_key) card.setAttribute('data-public-key', String(node.public_key).trim().toLowerCase());
                const cardClickIdent = node.node_id || node.public_key || nodeId;
                card.onclick = () => focusNode(cardClickIdent, hasValidCoords ? [lat, lon] : null);

                card.innerHTML = `
                    <div class="node-title-row">
                        <div class="node-title-group">
                            <span class="node-badge-id">${nodeId.toUpperCase()}</span>
                            <span class="node-name" title="${name}">${name}</span>
                        </div>
                        <span class="node-bot-badge" title="${botTitle}">🤖 ${botId}</span>
                    </div>

                    <div class="node-metrics-row">
                        <div class="node-indicators">
                            ${battV !== null ? `<span class="metric-pill battery ${battStyle.class}" title="Baterija (atnaujinta: ${formatLithuanianDateTime(telemTime) || 'Nėra'})">🔋 ${battStyle.text}</span>` : '<span class="metric-pill" style="color:var(--text-dim);" title="Baterijos duomenų nėra">🔋 -</span>'}
                            ${tempC !== null ? `<span class="metric-pill temp ${tempStyle.class}" title="Temperatūra (atnaujinta: ${formatLithuanianDateTime(telemTime) || 'Nėra'})">🌡️ ${tempStyle.text}</span>` : '<span class="metric-pill" style="color:var(--text-dim);" title="Temperatūros duomenų nėra">🌡️ -</span>'}
                        </div>
                        <div class="node-telem-time" title="Telemetrija atnaujinta: ${formatLithuanianDateTime(telemTime) || 'Nėra'}">
                            ${telemTime ? `<span style="color:#c084fc; font-weight:600;">⏱️ ${formatRelativeTime(telemTime)}</span>` : ''}
                        </div>
                    </div>

                    <div class="node-details-row">
                        <div class="node-loc-status">
                            ${hasValidCoords ? `<span style="color:var(--accent-cyan);">📍 ${parseFloat(lat).toFixed(3)}, ${parseFloat(lon).toFixed(3)}</span>` : '<span style="color:var(--text-dim);">📍 Be koord.</span>'}
                        </div>
                        <div class="node-seen-time" title="Paskutinį kartą matytas: ${formatLithuanianDateTime(lastSeen)}">
                            <span>📡 ${formatRelativeTime(lastSeen)}</span>
                        </div>
                    </div>
                `;

                listContainer.appendChild(card);
            });

            // Atnaujiname mobilias žymas

            const mobileTabCount = document.getElementById('mobileTabCount');
            if (mobileTabCount) mobileTabCount.innerText = nodeList.length;
            const floatingBadge = document.getElementById('floatingBadge');
            if (floatingBadge) floatingBadge.innerText = nodeList.length;

            // Jei turime žymeklių žemėlapyje - automatiškai pritraukiame kamerą (jei fitBounds = true)
            if (hasCoordinatesCount > 0 && fitBounds) {
                map.fitBounds(markersGroup.getBounds(), { padding: [60, 60], maxZoom: 13 });
            }
        }

        // Paspaudus ant mazgo sąraše arba atidarius nuorodą su #ident – nuskrendame į žemėlapį ir atidarome statistiką
        async function focusNode(ident, coords = null) {
            if (!ident) return;

            const cleanIdent = String(ident).replace(/^0x/i, '').replace(/^[#!]+/, '').trim().toLowerCase();
            let nodeData = findNodeByIdentifier(ident);

            // Jeigu mazgas dar nerastas lokaliai (pvz. dinamiškai įrašius hash naršyklėje), bandome pasiekti per serverį su target
            if (!nodeData && cleanIdent) {
                const endpoints = [
                    `/api/nodes?target=${encodeURIComponent(cleanIdent)}&all=1&_t=${Date.now()}`,
                    `/nodes.php?target=${encodeURIComponent(cleanIdent)}&all=1&_t=${Date.now()}`
                ];
                for (const url of endpoints) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (res.ok) {
                            const data = await res.json();
                            const incoming = data.repeaters || data.nodes || [];
                            if (incoming.length > 0) {
                                allLoadedNodes = incoming;
                                applyActiveFilters(false);
                                nodeData = findNodeByIdentifier(ident);
                                break;
                            }
                        }
                    } catch (e) {}
                }
            }

            // Jeigu mazgas rastas bendrame sąraše, bet šiuo metu paslėptas po aktyviais filtrais – atstatome filtrus
            if (nodeData && Array.isArray(repeaters) && !repeaters.some(n => matchesNodeIdentifier(n, ident))) {
                resetAllFilters();
                nodeData = findNodeByIdentifier(ident);
            }

            const actualNodeId = nodeData ? (nodeData.node_id || (nodeData.public_key ? nodeData.public_key.substring(0, 4) : 'node')) : cleanIdent;
            const cleanActualId = String(actualNodeId).replace(/^[#!]+/, '').toLowerCase();
            const pubKey = nodeData ? String(nodeData.public_key || '').trim().toLowerCase() : '';

            // 1. Aktyvuojame kortelę šoniniame sąraše ir priskroliname
            document.querySelectorAll('.node-item-card').forEach(c => c.classList.remove('active'));
            let card = document.getElementById(`card-${actualNodeId}`) || document.getElementById(`card-${cleanActualId}`);
            if (!card && pubKey) {
                card = document.querySelector(`.node-item-card[data-public-key="${pubKey}"]`);
            }
            if (!card && nodeData) {
                const cId = (nodeData.node_id || '').replace(/^[#!]+/, '').toLowerCase();
                card = document.querySelector(`.node-item-card[data-node-id="${cId}"], .node-item-card[data-clean-id="${cId}"]`);
            }
            if (!card && cleanIdent.length >= 4) {
                card = document.querySelector(`.node-item-card[data-clean-id="${cleanIdent.substring(0, 4)}"]`);
            }
            if (card) {
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // 2. Sinchronizuojame URL hash (#1bbd arba pilną public_key)
            const isPubKeySearch = cleanIdent.length > 8;
            const targetHash = isPubKeySearch
                ? (pubKey || cleanIdent)
                : (nodeData && nodeData.node_id ? nodeData.node_id.replace(/^[#!]+/, '').toLowerCase() : cleanIdent);

            if (targetHash && window.location.hash !== ('#' + targetHash)) {
                if (history.replaceState) {
                    history.replaceState(null, '', '#' + targetHash);
                } else {
                    window.location.hash = targetHash;
                }
            }

            const isMobile = window.innerWidth <= 768;

            // 3. Mobiliame įrenginyje: perjungiame į žemėlapį ir atidarome bottom sheet
            if (isMobile) {
                switchMobileView('map');
                if (nodeData) {
                    setTimeout(() => openMobileSheet(nodeData), 350);
                }
            }

            // 4. Surandame žymeklį žemėlapyje
            const marker = (pubKey && markersMap[pubKey]) ||
                           markersMap[actualNodeId] ||
                           markersMap[cleanActualId] ||
                           markersMap[cleanIdent] ||
                           (cleanIdent.length >= 4 && markersMap[cleanIdent.substring(0, 4)]) ||
                           (nodeData?.node_id && (markersMap[nodeData.node_id] || markersMap[nodeData.node_id.toLowerCase()] || markersMap[nodeData.node_id.replace(/^[#!]+/, '').toLowerCase()])) ||
                           (nodeData?.public_key && markersMap[nodeData.public_key.toLowerCase()]);

            const lat = nodeData?.latitude || (nodeData?.location ? nodeData.location.latitude : null);
            const lon = nodeData?.longitude || (nodeData?.location ? nodeData.location.longitude : null);
            const hasValidCoords = (lat !== null && lon !== null && Math.abs(lat) > 0.001 && Math.abs(lon) > 0.001);
            const targetCoords = marker ? marker.getLatLng() : (coords || (hasValidCoords ? [lat, lon] : null));

            if (marker) {
                map.flyTo(marker.getLatLng(), 14, { duration: 0.9 });
                if (!isMobile) {
                    map.closePopup();
                    setTimeout(() => {
                        marker.openPopup();
                    }, 600);
                }
            } else if (targetCoords) {
                map.flyTo(targetCoords, 14, { duration: 0.9 });
                if (!isMobile && nodeData) {
                    openMobileSheet(nodeData);
                }
            } else if (!isMobile && nodeData) {
                // Mazgas neturi GPS koordinačių žemėlapyje – atidarome išsamų modalą su statistika ir grafiku
                openMobileSheet(nodeData);
            }
        }

        // Stebime URL hash pasikeitimus (naršyklės atgal/pirmyn mygtukai arba tiesioginis nuorodos pakeitimas)
        window.addEventListener('hashchange', () => {
            const ident = getUrlNodeIdentifier();
            if (ident) {
                focusNode(ident);
            }
        });

        // Sąrašo filtravimas
        function filterNodesList() {
            applyActiveFilters(false);
        }

        // Stebime ekrano dydžio pasikeitimus (portrait/landscape/desktop)
        window.addEventListener('resize', () => {
            initMobileView();
            if (map) map.invalidateSize();
        });

        // Prijungiame globalias funkcijas prie window ir suderiname su ankstyvaisiais stubs
        window.fetchNodesData = window._fetchNodesData = fetchNodesData;
        window.onTelemetryToggleChange = window._onTelemetryToggleChange = onTelemetryToggleChange;
        window.switchMobileView = window._switchMobileView = switchMobileView;
        window.setColorFilter = window._setColorFilter = setColorFilter;
        window.onVoltSelectChange = window._onVoltSelectChange = onVoltSelectChange;
        window.onStaleFilterChange = window._onStaleFilterChange = onStaleFilterChange;
        window.onVoltCustomInputChange = window._onVoltCustomInputChange = onVoltCustomInputChange;
        window.resetAllFilters = window._resetAllFilters = resetAllFilters;
        window.onSearchInput = window._onSearchInput = onSearchInput;
        window.clearSearchInput = window._clearSearchInput = clearSearchInput;
        window.toggleMobileView = window._toggleMobileView = toggleMobileView;
        window.closeMobileSheet = window._closeMobileSheet = closeMobileSheet;
        window.openMobileSheet = window._openMobileSheet = openMobileSheet;
        window.changeSheetChartDays = window._changeSheetChartDays = changeSheetChartDays;
        window.changePopupChartDays = window._changePopupChartDays = changePopupChartDays;
        window.sheetActionFocus = window._sheetActionFocus = sheetActionFocus;
        window.sheetActionNavigate = window._sheetActionNavigate = sheetActionNavigate;
        window.focusNode = focusNode;
        window.getUrlNodeIdentifier = getUrlNodeIdentifier;
        window.matchesNodeIdentifier = matchesNodeIdentifier;
        window.findNodeByIdentifier = findNodeByIdentifier;

        // Paleidžiame žemėlapį užsikrovus DOM
        document.addEventListener('DOMContentLoaded', () => {
            initMap();

            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) refreshBtn.onclick = () => fetchNodesData(true);

            const hideTelemInput = document.getElementById('hideNoTelemetryInput');
            if (hideTelemInput) hideTelemInput.onchange = (e) => onTelemetryToggleChange(e.target.checked);

            const staleSel = document.getElementById('mapStaleFilterSelect');
            if (staleSel) staleSel.onchange = (e) => onStaleFilterChange(e.target.value);

            const voltSel = document.getElementById('mapVoltSelect');
            if (voltSel) voltSel.onchange = (e) => onVoltSelectChange(e.target.value);
        });
    </script>
</body>
</html>
