name: Build bot firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bot-firmware.yml
      - .github/firmware/config.h
      - XIAO_S3_Mesh_Bot/**
      - '!XIAO_S3_Mesh_Bot/config.h'
      - '!XIAO_S3_Mesh_Bot/build/**'
  pull_request:
    paths:
      - .github/workflows/bot-firmware.yml
      - .github/firmware/config.h
      - XIAO_S3_Mesh_Bot/**
      - '!XIAO_S3_Mesh_Bot/config.h'
      - '!XIAO_S3_Mesh_Bot/build/**'

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      FQBN: esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=default,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,PSRAM=disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: '1.6.0'

      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install 'RadioLib@7.6.0' 'ArduinoJson@7.4.3'

      - name: Compile and collect firmware images
        id: build
        run: |
          work_dir=$(mktemp -d "$RUNNER_TEMP/meshpuller.XXXXXX")
          source_dir=XIAO_S3_Mesh_Bot
          sketch_dir="$work_dir/$source_dir"
          build_dir="$work_dir/build"
          artifact_dir="$work_dir/firmware"
          mkdir -p "$sketch_dir/src" "$artifact_dir"

          # Build only from the sketch sources and the credential-free deployment profile.
          cp "$source_dir/"{XIAO_S3_Mesh_Bot.ino,MeshCorePacket.h,MeshCrypto.h,WebConfigPortal.h} "$sketch_dir/"
          cp -R "$source_dir/src/ed25519" "$sketch_dir/src/"
          cp .github/firmware/config.h "$sketch_dir/config.h"

          arduino-cli compile --fqbn "$FQBN" --build-path "$build_dir" "$sketch_dir"
          for image in "$source_dir.ino.bin" "$source_dir.ino.merged.bin"; do
            test -s "$build_dir/$image" || { echo "Missing firmware image: $image" >&2; exit 1; }
          done
          app="$artifact_dir/MeshPuller_XIAO_S3_8MB_app.bin"
          merged="$artifact_dir/MeshPuller_XIAO_S3_8MB_merged.bin"
          cp "$build_dir/$source_dir.ino.bin" "$app"
          cp "$build_dir/$source_dir.ino.merged.bin" "$merged"
          # Verify the 8 MiB merged image contains this build's app at 0x10000.
          test "$(stat -c %s "$merged")" -eq $((8 * 1024 * 1024))
          cmp -n "$(stat -c %s "$app")" "$app" "$merged" 0 "$((0x10000))"
          printf 'artifact_dir=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload firmware images
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meshpuller-xiao-esp32s3-8mb-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.artifact_dir }}/MeshPuller_XIAO_S3_8MB_app.bin
            ${{ steps.build.outputs.artifact_dir }}/MeshPuller_XIAO_S3_8MB_merged.bin
          if-no-files-found: error
